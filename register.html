<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpace - Sign Up</title>
    <link rel="stylesheet" href="signup-style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            SAFE<span class="green">SPACE</span>
        </div>
        
        <h2>Sign up</h2>
        <a href="login.html" class="login-link">I have an account</a>
        
        <form id="registration-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>
            
            <button type="submit" class="signup-btn">Sign up</button>
        </form>
        
        <div class="divider"></div>
        
        <h3>Or sign up with</h3>
        
        <div class="social-buttons">
            <button type="button" class="social-btn">
                <img src="https://www.google.com/favicon.ico" alt="Google" width="20" style="margin-right: 10px;">
                Sign up with Google
            </button>
            <button type="button" class="social-btn">
                <img src="https://www.facebook.com/favicon.ico" alt="Facebook" width="20" style="margin-right: 10px;">
                Sign up with Facebook
            </button>
            <button type="button" class="social-btn">
                <img src="https://www.apple.com/favicon.ico" alt="Apple" width="20" style="margin-right: 10px;">
                Sign up with Apple
            </button>
        </div>
    </div>

    <script>
        document.getElementById('registration-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            
            // Store user data
            localStorage.setItem('username', username);
            localStorage.setItem('email', email);
            
            // Redirect to dashboard
            window.location.href = 'dash.html';
        });
    </script>
</body>
</html>
