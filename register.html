<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpace - Sign Up</title>
    <link rel="stylesheet" href="signup-style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            SAFE<span class="green">SPACE</span>
          </div>
        
        <h2>Sign up</h2>
        <a href="#" class="login-link">I have an account</a>
        
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username">
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">
        </div>
        
        <a href="Dash.html"><button class="signup-btn">Sign up</button></a>
        
        <div class="divider"></div>
        
        <h3>Sign up</h3>
        
        <div class="social-buttons">
            <button class="social-btn">
                
                <img src="#" alt="Google" width="20" style="margin-right: 10px;">
                Sign up with Google
            </button>
            <button class="social-btn">
                <img src="#" alt="Facebook" width="20" style="margin-right: 10px;">
                Sign up with Facebook
            </button>
            <button class="social-btn">
                <img src="#" alt="Apple" width="20" style="margin-right: 10px;">
                Sign up with Apple
            </button>
        </div>
    </div>
</body>
</html>
